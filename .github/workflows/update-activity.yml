name: Update README Activity

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README via github-activity-readme
        uses: plastic-liu/gitalk@v1
        with:
          username: muditagrawal2007
          count: 5

      - name: Commit changes
        run: |
          git diff --quiet README.md || \
            git commit -am "chore: auto-update README activity section [skip ci]" && \
            git push
