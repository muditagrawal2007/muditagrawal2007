<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style type="text/css"><![CDATA[
      .container { animation: float 6s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-8px); }
      }
      .pulse      { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%,100% { opacity: 0.85; }
        50%     { opacity: 1; }
      }
      .glow1      { animation: glowShift 4s ease-in-out infinite; }
      .glow2      { animation: glowShift 4s ease-in-out infinite -1.3s; }
      .glow3      { animation: glowShift 4s ease-in-out infinite -2.6s; }
      @keyframes glowShift {
        0%,100% { filter: drop-shadow(0 0 6px currentColor); }
        50%     { filter: drop-shadow(0 0 18px currentColor); }
      }
      .row { transform-origin: 0 0; animation: tilt 8s ease-in-out infinite; }
      @keyframes tilt {
        0%,100% { transform: matrix(1,0.05,-0.18,1,0,0); }
        50%     { transform: matrix(1,-0.04,-0.22,4,0,0); }
      }
    ]]></style>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117"/>

  <text x="400" y="40" font-family="JetBrains Mono, monospace" font-size="16"
        fill="#58a6ff" text-anchor="middle">
    ⛰ Contribution Activity — 3D Isometric View
  </text>

  <g class="container" transform="translate(60,60)">
    <g class="row">
      <!-- 7 rows × 52 columns grid drawn as isometric tiles -->
      <!-- Row 0 (highest contribution months) -->
      <g transform="skewX(-30) scale(1,0.6)">
        <g transform="translate(0,0)">
          <!-- col 0 -->
          <g transform="translate(0,0)"   class="glow1" style="color:#39c5cf"><rect width="10" height="10" fill="#0e4429"/></g>
          <g transform="translate(11,0)"  class="glow1" style="color:#39c5cf"><rect width="10" height="10" fill="#006d32"/></g>
          <g transform="translate(22,0)"  class="glow1" style="color:#39c5cf"><rect width="10" height="10" fill="#26a641"/></g>
          <g transform="translate(33,0)"  class="glow1" style="color:#39c5cf"><rect width="10" height="10" fill="#39d353"/></g>
          <g transform="translate(44,0)"  class="glow1" style="color:#39c5cf"><rect width="10" height="10" fill="#26a641"/></g>
        </g>
        <g transform="translate(0,11)">
          <g transform="translate(0,0)"   class="glow2" style="color:#a371f7"><rect width="10" height="10" fill="#006d32"/></g>
          <g transform="translate(11,0)"  class="glow2" style="color:#a371f7"><rect width="10" height="10" fill="#26a641"/></g>
          <g transform="translate(22,0)"  class="glow2" style="color:#a371f7"><rect width="10" height="10" fill="#39d353"/></g>
          <g transform="translate(33,0)"  class="glow2" style="color:#a371f7"><rect width="10" height="10" fill="#39d353"/></g>
        </g>
        <g transform="translate(0,22)">
          <g transform="translate(0,0)"   class="glow3" style="color:#1f6feb"><rect width="10" height="10" fill="#0e4429"/></g>
          <g transform="translate(11,0)"  class="glow3" style="color:#1f6feb"><rect width="10" height="10" fill="#006d32"/></g>
          <g transform="translate(22,0)"  class="glow3" style="color:#1f6feb"><rect width="10" height="10" fill="#26a641"/></g>
          <g transform="translate(33,0)"  class="glow3" style="color:#1f6feb"><rect width="10" height="10" fill="#39d353"/></g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(400,160)" class="pulse">
    <text font-family="JetBrains Mono, monospace" font-size="13"
          fill="#8b949e" text-anchor="middle">
      🟦 Low   🟩 Medium   🟨 High   🟥 Peak
    </text>
  </g>

  <text x="400" y="300" font-family="JetBrains Mono, monospace" font-size="12"
        fill="#484f58" text-anchor="middle">
    ⚡ Auto-updated: live-stats workflow · 6-hour cadence
  </text>
</svg>
