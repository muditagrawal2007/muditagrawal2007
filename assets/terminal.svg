<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style type="text/css"><![CDATA[
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink {
        0%   { opacity: 1; }
        50%  { opacity: 0; }
        100% { opacity: 1; }
      }
      .line { opacity: 0; animation: revealLine 5s infinite; }
      .line.l1 { animation-delay: 0s; }
      .line.l2 { animation-delay: 0.8s; }
      .line.l3 { animation-delay: 1.6s; }
      .line.l4 { animation-delay: 2.4s; }
      .line.l5 { animation-delay: 3.2s; }
      .line.l6 { animation-delay: 4.0s; }
      @keyframes revealLine {
        0%, 100% { opacity: 0; }
        10%, 80% { opacity: 1; }
      }
      .scanline { animation: scan 3s ease-in-out infinite; }
      @keyframes scan {
        0%   { transform: translateY(-160px); opacity: 0.3; }
        50%  { opacity: 0.7; }
        100% { transform: translateY(160px);  opacity: 0; }
      }
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="28" fill="#21262d"/>
  <circle cx="14" cy="14" r="6" fill="#ff5f57"/>
  <circle cx="34" cy="14" r="6" fill="#febc2e"/>
  <circle cx="54" cy="14" r="6" fill="#28c840"/>
  <text x="350" y="19" font-family="JetBrains Mono, monospace" font-size="13"
        fill="#8b949e" text-anchor="middle">mudit@ai-lab: ~/profile</text>

  <!-- Scanline for retro CRT feel -->
  <g class="scanline">
    <rect x="0" y="100" width="700" height="2" fill="#58a6ff" opacity="0.4"/>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#c9d1d9">
    <text x="20" y="60"  class="line l1">
      <tspan fill="#a371f7">mudit</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#39c5cf">ai-lab</tspan><tspan fill="#8b949e">:~ $</tspan> <tspan fill="#c9d1d9">git status</tspan>
    </text>
    <text x="20" y="100" class="line l2" fill="#7ee787">On branch main — your branch is up to date.</text>
    <text x="20" y="140" class="line l3">
      <tspan fill="#a371f7">mudit</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#39c5cf">ai-lab</tspan><tspan fill="#8b949e">:~ $</tspan> <tspan fill="#c9d1d9">python build.py --deploy</tspan>
    </text>
    <text x="20" y="180" class="line l4" fill="#d0d7de">⟫ Building embeddings (384-dim)…</text>
    <text x="20" y="200" class="line l4" fill="#d0d7de">⟫ Indexing 10K vectors into FAISS… [████████████ 100%]</text>
    <text x="20" y="240" class="line l5" fill="#7ee787">✓ Deployed to production. Stargazers: +12 today</text>
    <text x="20" y="290" class="line l6">
      <tspan fill="#a371f7">mudit</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#39c5cf">ai-lab</tspan><tspan fill="#8b949e">:~ $</tspan> <tspan fill="#c9d1d9">_</tspan>
    </text>
    <rect x="285" y="278" width="14" height="20" fill="#c9d1d9" class="cursor"/>
  </g>
</svg>
