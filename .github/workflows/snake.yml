name: Generate Custom Snake SVG

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Try GraphQL (often returns 0 from workflow tokens)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > query.json <<'QUERY'
          {"query":"{ user(login: \"muditagrawal2007\") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount weekday } } } } } }"}
          QUERY
          curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @query.json \
            "https://api.github.com/graphql" > cal_live.json
          python3 -c "import json; d=json.load(open('cal_live.json')); print('live total:', d.get('data',{}).get('user',{}).get('contributionsCollection',{}).get('contributionCalendar',{}).get('totalContributions', 0))"

      - name: Choose data source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          live = json.loads(Path("cal_live.json").read_text()).get("data", {}).get("user", {}).get("contributionsCollection", {}).get("contributionCalendar", {})
          live_total = live.get("totalContributions", 0)
          Path("cal_live.json").write_text(json.dumps(live, indent=2) if live and live_total > 0 else "{}")

          # If live has 0 contributions (workflow-token limitation), use committed snapshot
          if live_total == 0:
              try:
                  committed = Path("cal.json").read_text()
                  Path("cal_use.json").write_text(committed)
                  print(f"Using committed cal.json (live was 0)")
              except FileNotFoundError:
                  Path("cal_use.json").write_text("{}")
                  print(f"No committed cal.json")
          else:
              Path("cal_use.json").write_text(json.dumps(live))
              print(f"Using live data: {live_total} contributions")
          PY

      - name: Generate snake SVG
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          data = json.loads(Path("cal_use.json").read_text())
          if not data.get("weeks"):
              print("no data"); sys.exit(0)
          cal = data
          grid = [[d["contributionCount"] for d in w["contributionDays"]] for w in cal["weeks"]]

          cells = [(di, wi, c) for wi, col in enumerate(grid) for di, c in enumerate(col) if c > 0]
          total = cal.get("totalContributions", sum(c for col in grid for c in col))
          print(f"Grid: {len(grid)} weeks, {len(cells)} active cells, total {total}")
          if not cells:
              sys.exit(0)

          cell_size = 16
          w_px = len(grid) * cell_size
          h_px = 7 * cell_size

          p = []
          p.append('<?xml version="1.0" encoding="UTF-8"?>')
          p.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w_px + 32} {h_px + 64}" width="{w_px + 32}" height="{h_px + 64}">')
          p.append('<style>')
          p.append('.c0{fill:#161b22}.c1{fill:#01311f}.c2{fill:#034525}.c3{fill:#0f6d31}.c4{fill:#00c647}rect.cell{rx:2;ry:2}.snake{fill:#ff8c00;stroke:#ff4500;stroke-width:1.5}.snake-head{fill:#ff1744}')
          p.append('</style>')
          p.append('<rect width="100%" height="100%" fill="#0d1117"/>')

          for wi, col in enumerate(grid):
              for di, count in enumerate(col):
                  cls = f"c{min(count, 4)}" if count else "c0"
                  x, y = wi * cell_size + 4, (6 - di) * cell_size + 4
                  p.append(f'<rect class="cell {cls}" x="{x}" y="{y}" width="14" height="14"/>')

          ordered = sorted(cells, key=lambda c: (c[1], c[0]))
          segs = [(wi*cell_size+11, (6-di)*cell_size+11, i) for i, (di, wi, _) in enumerate(ordered[-30:])]

          for cx, cy, i in segs:
              p.append(f'<circle class="snake" cx="{cx}" cy="{cy}" r="5"><animate attributeName="opacity" values="1;.4;1" dur="1.5s" begin="{i*0.05:.2f}s" repeatCount="indefinite"/></circle>')

          if segs:
              cx, cy, _ = segs[-1]
              p.append(f'<circle class="snake-head" cx="{cx}" cy="{cy}" r="6"><animate attributeName="r" values="6;8;6" dur="0.6s" repeatCount="indefinite"/></circle>')

          if len(segs) >= 2:
              pts = " ".join(f"{x},{y}" for x, y, _ in segs[-20:])
              p.append(f'<polyline points="{pts}" fill="none" stroke="#ff8c00" stroke-width="2" opacity=".4"><animate attributeName="opacity" values=".2;.8;.2" dur="3s" repeatCount="indefinite"/></polyline>')

          p.append(f'<text x="8" y="{h_px + 30}" font-family="JetBrains Mono, monospace" font-size="11" fill="#58a6ff">Snake eating your real GitHub contributions — {total} this year</text>')
          p.append('</svg>')

          out = "\n".join(p)
          Path("snake-custom.svg").write_text(out)
          print(f"snake-custom.svg: {len(out)} bytes")
          PY

      - name: Commit and deploy
        run: |
          set -e
          mkdir -p assets
          cp snake-custom.svg assets/snake.svg
          git config user.email "snake-bot@users.noreply.github.com"
          git config user.name  "snake-bot"
          git add assets/snake.svg
          git commit -m "chore: regenerate custom snake [skip ci]" || echo "no changes"
          git push
